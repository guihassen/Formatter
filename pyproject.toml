[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formatter"
version = "0.1.0"
description = "Dictation formatter for DronsioFlow"
requires-python = ">=3.10"
dependencies = ["pandas", "datasets", "gensim", "transformers"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["formatter"]
